<style>
/* Layout: an exam answer booklet — cover sheet header, ruled sheets for each section, examiner's red-pen grades in the margin. Light only, by request. */
:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#1c2333; --ink-2:#5b6478; --ink-3:#8a92a3;
  --rule:#dde2ea; --rule-2:#eef1f6; --pen:#c4302b; --ok:#1d8a57; --warn:#b06d0f; --bad:#c4302b;
  --ok-bg:#e3f4ea; --warn-bg:#fbf0dc; --bad-bg:#fbe5e3; --muted-bg:#eef0f4; --blue-bg:#e6edfb;
  --f-head:'Archivo',system-ui,sans-serif; --f-body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace; --f-pen:'Kalam','Comic Sans MS',cursive;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-head);font-stretch:85%;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
:focus-visible{outline:2px solid #2f5bd3;outline-offset:2px;border-radius:4px}

/* cover */
.cover{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:repeating-linear-gradient(180deg,var(--ink) 0 3px,transparent 3px 6px)}
.cover h1{font-size:clamp(28px,5vw,44px);font-weight:800;font-stretch:78%;letter-spacing:-.01em;line-height:1}
.cand{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--ink-2);font-size:13px}
.cand b{color:var(--ink);font-weight:700}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.tally>div{border:1px solid var(--rule);border-radius:4px;padding:8px 12px;min-width:92px}
.tally .n{font-family:var(--f-head);font-weight:800;font-stretch:80%;font-size:26px;line-height:1}
.tally .t{font-size:11px;color:var(--ink-2);margin-top:4px}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 10px;flex-wrap:wrap}
.sec h2{font-size:20px;font-weight:800;font-stretch:85%}
.sec .note{font-size:12px;color:var(--ink-3)}

/* subject cards */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:14px 16px 14px 20px;text-decoration:none;position:relative;transition:transform .15s,box-shadow .15s;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(28,35,51,.35)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:19px;font-weight:800;font-stretch:85%}
.code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.scoreRow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.big{font-family:var(--f-head);font-weight:800;font-stretch:72%;font-size:40px;line-height:1;color:var(--c)}
.big small{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--ink-2);margin-left:6px;font-stretch:100%}
.big.none{font-size:18px;color:var(--ink-3);font-stretch:90%;font-weight:600}
.pen{font-family:var(--f-pen);color:var(--pen);font-size:22px;line-height:1;border:2px solid var(--pen);border-radius:50%;padding:8px 9px 5px;transform:rotate(-8deg);display:inline-block;min-width:44px;text-align:center;white-space:nowrap}
.pen.sm{font-size:15px;padding:4px 7px 2px;border-width:1.5px;min-width:30px}
.pen.wide{border-radius:999px;font-size:15px;padding:6px 10px 3px;transform:rotate(-5deg)}
.pen.sm.wide{font-size:13px;padding:3px 7px 1px}
.hl{font-size:12px;color:var(--ink-2)}
.spark{width:100%;height:44px;display:block}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip i{width:10px;height:10px;border-radius:2px;display:block}
.sum{font-size:13px;color:var(--ink-2)}
.go{font-family:var(--f-head);font-stretch:85%;font-weight:700;font-size:12px;color:var(--c);margin-top:auto}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--muted-bg);color:var(--ink-2);width:fit-content}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.watch{background:var(--warn-bg);color:var(--warn)} .chip.heavy{background:var(--bad-bg);color:var(--bad)}

/* status colours (chapter states) */
.s-tested{background:var(--ok)} .s-revised{background:#7fa7e8} .s-missing{background:var(--warn)} .s-pending{background:#e2b55a}
.s-confirm{background:var(--bad)} .s-notstarted{background:#d5dae3} .s-unknown{background:#e8ebf0;outline:1px dashed #b7bfcc;outline-offset:-1px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-tested{background:var(--ok-bg);color:var(--ok)} .p-revised{background:var(--blue-bg);color:#2f5bd3} .p-missing{background:var(--warn-bg);color:var(--warn)}
.p-pending{background:var(--warn-bg);color:var(--warn)} .p-confirm{background:var(--bad-bg);color:var(--bad)} .p-notstarted,.p-unknown{background:var(--muted-bg);color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* sheets & tables */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;min-width:0}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--f-head);font-stretch:85%;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.bar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar b{display:block;height:8px;border-radius:2px;background:var(--rule-2);flex:1;position:relative;overflow:hidden}
.bar b i{position:absolute;inset:0 auto 0 0;border-radius:2px}
.bar span{font-family:var(--f-mono);font-size:12px;width:36px;text-align:right}
.mute{color:var(--ink-3)}
.unit td{background:#f6f8fb;font-family:var(--f-head);font-stretch:85%;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:7px 12px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" +";color:var(--ink-3);font-weight:400}
details[open] summary::after{content:" −"}
.topics{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);columns:2;column-gap:20px}
.cnote{font-size:12px;color:var(--ink-2);margin-top:3px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule-2);font-size:14px}
.list li:last-child{border-bottom:0}
.list .k{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.list.fix .k{color:var(--ok)} .list.gap .k{color:var(--pen);font-weight:600}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.box h3{font-size:16px;font-weight:800;font-stretch:85%;padding:12px 14px 8px;border-bottom:1px solid var(--rule)}
.box p{margin:0;padding:12px 14px;font-size:14px;color:var(--ink-2)}

/* subject header */
.back{display:inline-block;font-family:var(--f-head);font-stretch:85%;font-weight:700;font-size:13px;text-decoration:none;color:var(--ink-2);margin-bottom:10px}
.back:hover{color:var(--ink)}
.shead{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px 20px 18px 26px;position:relative;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
.shead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.shead h1{font-size:clamp(28px,5vw,40px);font-weight:800;font-stretch:78%}
.shead .big{font-size:52px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.stats div{font-size:12px;color:var(--ink-2)}
.stats b{display:block;font-family:var(--f-head);font-stretch:80%;font-size:22px;color:var(--ink)}

.state{background:var(--sheet);border:1px dashed var(--rule);border-radius:4px;padding:28px;text-align:center;color:var(--ink-2)}
.foot{margin-top:28px;font-size:12px;color:var(--ink-3)}

@media (max-width:960px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.grid3{grid-template-columns:minmax(0,1fr)}.cover,.shead,.cols2{grid-template-columns:minmax(0,1fr)}.topics{columns:1}}
@media (max-width:520px){.grid4{grid-template-columns:minmax(0,1fr)}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<script>
(function(){
  const LBL={tested:"Tested",revised:"Revised · no score",missing:"Score missing",pending:"Test waiting",confirm:"To confirm",notstarted:"Not started",unknown:"No record"};
  const ORDER=["tested","revised","missing","pending","confirm","notstarted","unknown"];
  const S={subjects:null,papers:null,home:null,err:null,slow:false};

  function h(tag,attrs,...kids){
    const el=document.createElement(tag);
    if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;
      if(k==="class")el.className=v;else if(k==="style")el.setAttribute("style",v);else if(k==="text")el.textContent=v;else el.setAttribute(k,v);}
    for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}
    return el;
  }
  const svgNS="http://www.w3.org/2000/svg";
  function s(tag,attrs){const el=document.createElementNS(svgNS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);return el;}
  const fmtDate=d=>{const [y,m,dd]=d.split("-").map(Number);return dd+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1];};
  const pct=(a,b)=>(a==null||!b)?null:Math.round(a*100/b);
  const cpct=c=>c.pct!=null?c.pct:pct(c.score,c.max);
  const bandCls=b=>b?"":"";

  function pen(band,sm){
    if(!band)return h("span",{class:"mute"},"—");
    return h("span",{class:"pen"+(sm?" sm":"")+(band.length>2?" wide":""),title:"Grade"},band);
  }
  function bar(p,color){
    if(p==null)return h("span",{class:"mute"},"—");
    const i=h("i",{style:"width:"+Math.max(2,Math.min(100,p))+"%;background:"+color});
    return h("div",{class:"bar"},h("b",null,i),h("span",null,p+"%"));
  }
  function spark(points,color,tall){
    const W=240,H=tall?70:44,pad=4;
    const svg=s("svg",{viewBox:`0 0 ${W} ${H}`,class:"spark",role:"img","aria-label":"Percent on each graded paper, oldest to newest",preserveAspectRatio:"none",style:tall?"height:70px":""});
    const y=v=>H-pad-(v/100)*(H-2*pad);
    [80,90].forEach(g=>{svg.append(s("line",{x1:0,x2:W,y1:y(g),y2:y(g),stroke:g===90?"#c4302b":"#b6bfcd","stroke-width":1,"stroke-dasharray":"3 3","vector-effect":"non-scaling-stroke",opacity:.7}));});
    if(points.length===0){return svg;}
    const xs=points.length===1?[W/2]:points.map((_,i)=>pad+i*(W-2*pad)/(points.length-1));
    const ys=points.map(y);
    const line=xs.map((x,i)=>(i?"L":"M")+x.toFixed(1)+" "+ys[i].toFixed(1)).join(" ");
    if(points.length>1)svg.append(s("path",{d:line+` L${xs[xs.length-1]} ${H} L${xs[0]} ${H} Z`,fill:color,opacity:.12}));
    svg.append(s("path",{d:line,fill:"none",stroke:color,"stroke-width":2,"vector-effect":"non-scaling-stroke","stroke-linejoin":"round"}));
    svg.append(s("circle",{cx:xs[xs.length-1],cy:ys[ys.length-1],r:3.5,fill:color,stroke:"#fff","stroke-width":1.5}));
    return svg;
  }
  const subjectPapers=key=>(S.papers||[]).filter(p=>p.subject===key).sort((a,b)=>a.date.localeCompare(b.date));
  function strip(chs){return h("div",{class:"strip","aria-label":"Chapter status"},chs.map(c=>h("i",{class:"s-"+c.status,title:"Ch "+c.num+": "+c.title+" · "+LBL[c.status]})));}

  function legend(){return h("div",{class:"legend"},ORDER.map(k=>h("span",null,h("i",{class:"s-"+k}),LBL[k])));}

  function card(sub){
    const pp=subjectPapers(sub.key).filter(p=>p.pct!=null).map(p=>p.pct);
    const hd=sub.headline;
    return h("a",{class:"card",href:"#"+sub.key,style:"--c:"+sub.color},
      h("div",{class:"top"},h("h3",null,sub.name),h("span",{class:"code"},sub.code+(sub.tier?" · "+sub.tier:""))),
      h("div",{class:"scoreRow"},
        hd?h("div",null,h("div",{class:"big"},hd.score+"/"+hd.max,h("small",null,hd.pct+"%")),h("div",{class:"hl"},hd.label))
          :h("div",{class:"big none"},"No graded score yet"),
        hd?pen(hd.band):null),
      pp.length?spark(pp,sub.color):null,
      strip(sub.chapters||[]),
      h("div",{class:"sum"},sub.summary),
      h("span",{class:"chip "+sub.status},sub.statusText),
      h("span",{class:"go"},"Open syllabus →"));
  }

  function gradeTable(papers,showSubject){
    const subs=Object.fromEntries((S.subjects||[]).map(x=>[x.key,x]));
    const rows=[...papers].sort((a,b)=>b.date.localeCompare(a.date));
    const head=h("tr",null,h("th",null,"Date"),showSubject?h("th",null,"Subject"):null,h("th",null,"Test"),h("th",{class:"hide-sm"},"Covers"),h("th",null,"Score"),h("th",null,"%"),h("th",null,"Grade"));
    const body=rows.map(p=>{const sb=subs[p.subject]||{name:p.subject,color:"#888"};
      return h("tr",null,
        h("td",{class:"num"},p.dateLabel||fmtDate(p.date)),
        showSubject?h("td",null,h("a",{href:"#"+p.subject,style:"text-decoration:none;font-weight:700"},h("span",{class:"dot",style:"background:"+sb.color}),sb.name)):null,
        h("td",null,p.test,p.note?h("div",{class:"cnote"},p.note):null),
        h("td",{class:"hide-sm"},p.chapters),
        h("td",{class:"num"},p.score==null?h("span",{class:"mute"},"not recorded"):p.score+"/"+p.max),
        h("td",null,bar(p.pct,sb.color)),
        h("td",null,pen(p.band,true)));});
    if(!rows.length)body.push(h("tr",null,h("td",{colspan:7,class:"mute"},"No graded papers yet.")));
    return h("div",{class:"sheet scroll"},h("table",null,h("thead",null,head),h("tbody",null,body)));
  }

  function renderHome(){
    const subs=[...S.subjects].sort((a,b)=>a.order-b.order);
    const graded=(S.papers||[]).filter(p=>p.score!=null).length;
    const allCh=subs.flatMap(x=>x.chapters||[]);
    const scored=allCh.filter(c=>c.status==="tested").length;
    const home=S.home||{};
    const pri=(home.priorities||[]);
    const subMap=Object.fromEntries(subs.map(x=>[x.key,x]));
    return h("div",null,
      h("header",{class:"cover"},
        h("div",null,h("div",{class:"label"},home.series||"Cambridge IGCSE"),h("h1",null,"Shaurya's Grade 10 Study Plan"),
          h("div",{class:"cand"},h("span",null,"Candidate ",h("b",null,home.candidate||"Shaurya Gala")),h("span",null,"Centre ",h("b",null,home.centre||"JBCN")),h("span",null,"Updated ",h("b",null,home.updated?fmtDate(home.updated)+" "+home.updated.slice(0,4):"—")))),
        h("div",{class:"tally"},
          h("div",null,h("div",{class:"n"},graded),h("div",{class:"t"},"papers graded")),
          h("div",null,h("div",{class:"n"},scored+"/"+allCh.length),h("div",{class:"t"},"chapters with a score")),
          h("div",null,h("div",{class:"n",style:"color:var(--pen)"},pri.length),h("div",{class:"t"},"gaps to close")))),
      h("div",{class:"sec"},h("h2",null,"Main subjects"),h("span",{class:"note"},"Dashed lines on each chart: 80% (A) and 90% (A*) planning marks")),
      h("div",{class:"grid3"},subs.filter(x=>x.group==="main").map(card)),
      h("div",{class:"sec"},h("h2",null,"Other subjects")),
      h("div",{class:"grid4"},subs.filter(x=>x.group!=="main").map(card)),
      h("div",{class:"sec"},h("h2",null,"Chapter key")),legend(),
      h("div",{class:"sec"},h("h2",null,"Every graded paper"),h("span",{class:"note"},"Newest first")),
      gradeTable(S.papers||[],true),
      h("div",{class:"sec"},h("h2",null,"Find and fix first"),h("span",{class:"note"},"In priority order")),
      h("div",{class:"sheet"},h("ol",{class:"list gap"},pri.map((p,i)=>h("li",null,h("span",{class:"k"},String(i+1).padStart(2,"0")),
        h("span",null,subMap[p.subject]?h("a",{href:"#"+p.subject,style:"text-decoration:none"},h("span",{class:"dot",style:"background:"+subMap[p.subject].color})):null,p.text))))));
  }

  function renderSubject(sub){
    const chs=sub.chapters||[];
    const papers=subjectPapers(sub.key);
    const pp=papers.filter(p=>p.pct!=null).map(p=>p.pct);
    const tested=chs.filter(c=>c.status==="tested");
    const avg=tested.length?Math.round(tested.reduce((a,c)=>a+(cpct(c)||0),0)/tested.length):null;
    const hd=sub.headline;
    let lastUnit=null;const rows=[];
    for(const c of chs){
      if(c.unit&&c.unit!==lastUnit){rows.push(h("tr",{class:"unit"},h("td",{colspan:6},c.unit)));lastUnit=c.unit;}
      const p=cpct(c);
      const title=c.sections&&c.sections.length
        ?h("details",null,h("summary",null,c.title),h("ol",{class:"topics"},c.sections.map(t=>h("li",null,t))))
        :h("div",{style:"font-weight:700"},c.title);
      rows.push(h("tr",null,
        h("td",{class:"num",style:"font-weight:600"},c.num),
        h("td",{style:"min-width:220px"},title,c.note?h("div",{class:"cnote"},c.note):null),
        h("td",null,h("span",{class:"pill p-"+c.status},LBL[c.status])),
        h("td",{class:"hide-sm"},c.testedIn||h("span",{class:"mute"},"—")),
        h("td",{class:"num"},c.score==null?h("span",{class:"mute"},"—"):c.score+"/"+c.max),
        h("td",null,bar(p,p==null?"":p>=80?"var(--ok)":p>=60?"var(--warn)":"var(--bad)"))));
    }
    return h("div",null,
      h("a",{class:"back",href:"#home"},"← All subjects"),
      h("header",{class:"shead",style:"--c:"+sub.color},
        h("div",null,h("div",{class:"label"},(sub.group==="main"?"Main subject · ":"")+sub.code+(sub.tier?" "+sub.tier:"")),
          h("h1",null,sub.name),h("p",{class:"sum",style:"margin:6px 0 10px;font-size:14px"},sub.summary),h("span",{class:"chip "+sub.status},sub.statusText),
          h("div",{class:"stats"},
            h("div",null,h("b",null,tested.length+"/"+chs.length),"chapters with a score"),
            h("div",null,h("b",null,avg==null?"—":avg+"%"),"average chapter score"),
            h("div",null,h("b",null,papers.length),"papers logged"))),
        h("div",null,
          h("div",{style:"display:flex;align-items:center;justify-content:space-between;gap:12px"},
            hd?h("div",null,h("div",{class:"big"},hd.score+"/"+hd.max,h("small",null,hd.pct+"%")),h("div",{class:"hl"},"Latest: "+hd.label)):h("div",{class:"big none"},"No graded score yet"),
            hd?pen(hd.band):null),
          pp.length?h("div",{style:"margin-top:10px"},h("div",{class:"label",style:"margin-bottom:4px"},"Each paper, oldest → newest"),spark(pp,sub.color,true)):null)),
      h("div",{class:"sec"},h("h2",null,"Syllabus and chapter scores"),h("span",{class:"note"},"Tap a chapter to see its topics")),
      h("div",{style:"margin-bottom:10px"},legend()),
      h("div",{class:"sheet scroll"},h("table",null,
        h("thead",null,h("tr",null,h("th",null,"Ch"),h("th",null,"Chapter"),h("th",null,"Status"),h("th",{class:"hide-sm"},"Tested in"),h("th",null,"Score"),h("th",null,"%"))),
        h("tbody",null,rows))),
      h("div",{class:"sec"},h("h2",null,"Graded papers")),
      gradeTable(papers,false),
      h("div",{class:"sec"},h("h2",null,"Work record")),
      h("div",{class:"cols2"},
        h("div",{class:"sheet box"},h("h3",null,"Revisions done"),h("p",null,sub.revisions),
          h("h3",{style:"border-top:1px solid var(--rule)"},"Papers used"),
          h("ul",{class:"list"},(sub.papersUsed||[]).map((t,i)=>h("li",null,h("span",{class:"k"},"·"),h("span",null,t))))),
        h("div",{class:"sheet box"},h("h3",null,"Fix list · what to change"),
          h("ol",{class:"list fix"},(sub.fixes||[]).map((t,i)=>h("li",null,h("span",{class:"k"},"✓"),h("span",null,t)))))),
      h("div",{class:"sec"},h("h2",null,"Gaps · find and fix"),h("span",{class:"note"},"Shaurya's to-do for this subject")),
      h("div",{class:"sheet"},h("ol",{class:"list gap"},(sub.gaps||[]).map((t,i)=>h("li",null,h("span",{class:"k"},String(i+1).padStart(2,"0")),h("span",null,t))))));
  }

  function render(){
    const view=document.getElementById("view");
    if(S.err){view.replaceChildren(h("div",{class:"state"},S.err));return;}
    if(!S.subjects){view.replaceChildren(h("div",{class:"state"},S.slow?"The records can't be reached yet. They'll appear here as soon as the connection answers.":"Loading Shaurya's records…"));return;}
    if(!S.subjects.length){view.replaceChildren(h("div",{class:"state"},"No records yet. Claude adds each subject, chapter and graded paper here."));return;}
    const key=(location.hash||"").slice(1);
    const sub=S.subjects.find(x=>x.key===key);
    view.replaceChildren(sub?renderSubject(sub):renderHome());
  }
  window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

  async function start(){
    const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
    if(!db){S.err="Open this page signed in to claude.ai to see Shaurya's records.";render();return;}
    const timer=setTimeout(()=>{S.slow=true;render();},10000);
    const fail=e=>{clearTimeout(timer);S.err=(e&&e.code==="revoked")?"This page's records are no longer available in this view.":"The records couldn't load. Reload the page to try again.";render();};
    const done=()=>{if(S.subjects&&S.papers&&S.home!==null)clearTimeout(timer);};
    db.collection("subjects").onSnapshot(q=>{S.subjects=q.docs.map(d=>Object.assign({key:d.id},d.data()));done();render();},fail);
    db.collection("papers").onSnapshot(q=>{S.papers=q.docs.map(d=>Object.assign({id:d.id},d.data()));done();render();},fail);
    db.doc("meta/home").onSnapshot(d=>{S.home=d.exists?d.data():{};done();render();},fail);
  }
  start();
})();
</script>
</body></html>
